    </style>
</head>
<body>

<!-- Dual background layers for crossfade -->
<div id="bg-a"></div>
<div id="bg-b"></div>
<div id="bg-label"></div>

<div class="app-header">
    <div class="header-top">
        <h1><div class="logo-badge">🏡</div>Manaya's New House</h1>
        <div style="font-size:0.72em;color:rgba(167,139,250,0.6);font-weight:500;margin-top:-10px;padding-left:42px;letter-spacing:0.3px;">Pre-Requisite Checklist ✨</div>
    </div>

        <span id="statsText">0/0 items packed</span>
        <span class="pct" id="statsPercent">0%</span>
    </div>
    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>
</div>

<div class="hint-bar">Tap any logo to shop on <b>Flipkart</b>, <b>Amazon</b> or <b>Meesho</b> 🛒</div>

<div class="content" id="content"></div>

<button class="fab" onclick="toggleMenu()">≡</button>
<div class="overlay" id="overlay" onclick="closeAll()"></div>

<div class="menu" id="menu">
    <button class="menu-btn" onclick="expandAll()">📂 Expand All</button>
    <button class="menu-btn" onclick="collapseAll()">📁 Collapse All</button>
    <button class="menu-btn" onclick="showExport()">📋 Export Markdown</button>
    <button class="menu-btn" onclick="confirmReset()">🗑️ Reset</button>
</div>

<div class="modal" id="exportModal">
    <h3>Export Checklist</h3>
    <button class="close-btn" onclick="closeAll()">×</button>
    <textarea id="exportArea" readonly></textarea>
    <button class="btn" onclick="copyExport()">📋 Copy to Clipboard</button>
    <button class="btn secondary" onclick="closeAll()">Close</button>
</div>

<div class="reset-confirm" id="resetModal">
    <h3>🗑️ Reset Progress?</h3>
    <p>Clear all checked items? This cannot be undone.</p>

        <button class="btn secondary" onclick="closeAll()">Cancel</button>
        <button class="btn danger" onclick="doReset()">Reset</button>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
const categories = [
    { icon:'🍳', name:'Kitchen',          bg:'minimalist+kitchen+interior+aesthetic',    items:["Plates & bowls","Mugs & glasses","Cutlery set","Chef's knife","Cutting board","Frying pan","Saucepan","Baking sheet","Mixing bowls","Spatula & spoons","Tongs & whisk","Can opener","Coffee maker","Toaster","Blender","Microwave","Kettle","Dish soap & sponges","Trash can","Food containers","Aluminum foil","Paper towels"] },
    { icon:'🛏️', name:'Bedroom',          bg:'minimalist+bedroom+cozy+aesthetic',        items:["Mattress & bed frame","Pillows & sheets","Duvet/blanket","Bedside table","Lamp","Hangers","Laundry basket","Full length mirror","Curtains","Alarm clock"] },
    { icon:'🚿', name:'Bathroom',         bg:'minimalist+bathroom+spa+aesthetic',        items:["Shower curtain","Bath mat","Towels & washcloths","Toilet brush","Plunger","Toilet paper","Soap dispenser","Shampoo","First aid kit","Trash can"] },
    { icon:'🛋️', name:'Living Room',      bg:'minimalist+living+room+cozy+aesthetic',   items:["Sofa/couch","Coffee table","TV & stand","Rugs","Curtains","Lamps","Throw pillows","Coasters","WiFi router"] },
    { icon:'🧹', name:'Cleaning',         bg:'clean+white+home+organization+aesthetic', items:["Vacuum cleaner","Broom & dustpan","Mop & bucket","All-purpose cleaner","Glass cleaner","Laundry detergent","Trash bags","Microfiber cloths"] },
    { icon:'🔧', name:'Tools',            bg:'modern+workshop+tools+organized',          items:["Hammer","Screwdriver set","Tape measure","Level","Drill","Wrench","Flashlight","Batteries","Extension cords","Light bulbs","Duct tape"] },
    { icon:'🚨', name:'Safety',           bg:'modern+home+security+interior',            items:["Smoke detectors","Fire extinguisher","First aid kit","Flashlight","Door locks"] },
    { icon:'🐱', name:'Gwen\'s Corner',    bg:'ragdoll+cat+aesthetic',               
     items:["Royal Canin Ragdoll kitten dry food","Wet cat food pouches (pâté)","Cat treats (Temptations / Dreamies)","Freeze-dried chicken cat treats","Dental treats for cats","Cat water fountain (ceramic)","Stainless steel food bowls (x2)","Premium clumping cat litter (bentonite)","Hooded litter box with carbon filter","Litter scoop & mat","Litter disposal bags","Cat carrier (airline approved)","Orthopedic cat bed (plush)","Heated cat blanket","Large multi-level cat tree (tall, sturdy)","Cat tree with condo & hammock perch","Wall-mounted cat hammock","Hanging canvas cat hammock","Window cat hammock (suction cup)","Feather wand teaser toy","Interactive laser pointer","Crinkle & catnip tunnel","Catnip spray & dried catnip","Soft plush mice toys","Puzzle feeder / slow feeder bowl","Cat grass & catnip pot","Grooming slicker brush (for long fur)","Wide-tooth dematting comb","Nail clippers for cats","Cat-safe wipes","Flea & tick monthly spot-on treatment","Cat toothbrush & enzymatic toothpaste","Pet first aid kit","Breakaway safety collar with ID tag","GPS pet tracker tag","Cat window perch / suction shelf","Calming diffuser (Feliway)","Pheromone calming collar"] },
    { icon:'✨', name:'House Aesthetics', bg:'boho+aesthetic+home+decor+vase+candles',   items:["Ceramic vase (neutral tones)","Dried pampas grass","Scented candles (vanilla/sandalwood)","Candle holder set","Abstract wall art print","Boho wall tapestry","LED fairy string lights","Macramé wall hanging","Woven rattan basket","Indoor plant (pothos/snake plant)","Terracotta plant pots","Linen throw blanket","Embroidered cushion covers","Table lamp with warm bulb","Bamboo tray organiser","Coffee table books (art/fashion)","Acrylic photo frames","Aesthetic desk organiser","Gold/brass accent bowl or tray","Wax melt warmer","Reed diffuser set","Velvet storage pouches","Minimalist wall clock","LED vanity mirror","Sage room spray"] }
];

// Specific curated Unsplash photo IDs per category for consistent, beautiful results
const catPhotos = {
    'Kitchen':          'https://images.unsplash.com/photo-1556909114-f6e7ad7d3136?w=1400&q=80&fit=crop',
    'Bedroom':          'https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?w=1400&q=80&fit=crop',
    'Bathroom':         'https://images.unsplash.com/photo-1552321554-5fefe8c9ef14?w=1400&q=80&fit=crop',
    'Living Room':      'https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=1400&q=80&fit=crop',
    'Cleaning':         'https://images.unsplash.com/photo-1581578731548-c64695cc6952?w=1400&q=80&fit=crop',
    'Tools':            'https://images.unsplash.com/photo-1504148455328-c376907d081c?w=1400&q=80&fit=crop',
    'Safety':           'https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=1400&q=80&fit=crop',
    'Gwen\'s Corner':   'https://images.unsplash.com/photo-1537151608828-ea2b11777ee8?w=1400&q=80&fit=crop',
    'House Aesthetics': 'https://images.unsplash.com/photo-1616486338812-3dadae4b4ace?w=1400&q=80&fit=crop',
};

// ── PERSISTENT STORAGE ──
function storageGet(key){try{const v=localStorage.getItem(key);if(v!==null)return v;}catch(e){}try{return sessionStorage.getItem(key);}catch(e){}return null;}
function storageSet(key,val){try{localStorage.setItem(key,val);return;}catch(e){}try{sessionStorage.setItem(key,val);}catch(e){}}

let checked = new Set(JSON.parse(storageGet('mv') || '[]'));
const itemURLs = new Map();

// ── BACKGROUND CROSSFADE ──────────────────────────────────────────
const bgA = document.getElementById('bg-a');
const bgB = document.getElementById('bg-b');
const bgLabel = document.getElementById('bg-label');
let bgActive = 'a';
let currentCat = null;
let labelTimer = null;

function preloadImages(){
    Object.values(catPhotos).forEach(url => {
        const img = new Image();
        img.src = url;
    });
}

function setBackground(catName){
    if(catName === currentCat) return;
    currentCat = catName;
    const url = catPhotos[catName];
    if(!url) return;

    const incoming = bgActive === 'a' ? bgB : bgA;
    const outgoing  = bgActive === 'a' ? bgA : bgB;

    incoming.style.backgroundImage = `url("${url}")`;
    incoming.style.opacity = '1';
    outgoing.style.opacity  = '0';
    bgActive = bgActive === 'a' ? 'b' : 'a';

    bgLabel.textContent = catName.toUpperCase();
    bgLabel.classList.add('show');
    if(labelTimer) clearTimeout(labelTimer);
    labelTimer = setTimeout(()=> bgLabel.classList.remove('show'), 2200);
}

function setupObserver(){
    const obs = new IntersectionObserver((entries)=>{
        let best = null, bestRatio = 0;
        entries.forEach(e => {
            if(e.isIntersecting && e.intersectionRatio > bestRatio){
                bestRatio = e.intersectionRatio;
                best = e.target;
            }
        });
        if(best){
            setBackground(best.dataset.catName);
        }
    }, { threshold:[0.2,0.4,0.6,0.8] });

    document.querySelectorAll('.category[data-cat-name]').forEach(el => obs.observe(el));
}

// ── SHOP URLS ─────────────────────────────────────────────────────
function buildURLs(){
    for(const cat of categories){
        for(const item of cat.items){
            const q = encodeURIComponent(item);
            itemURLs.set(item, {
                fk:  'https://www.flipkart.com/search?q=' + q,
                amz: 'https://www.amazon.in/s?k=' + q,
                meesho: 'https://www.meesho.com/search?q=' + q
            });
        }
    }
}

function openShop(itemName, site, e){
    e.stopPropagation();
    e.preventDefault();
    const urls = itemURLs.get(itemName);
    if(!urls) return;
    let url;
    if(site === 'fk') url = urls.fk;
    else if(site === 'amz') url = urls.amz;
    else if(site === 'meesho') url = urls.meesho;
    window.open(url, '_blank', 'noopener,noreferrer');
}

// ── INIT ──────────────────────────────────────────────────────────
function init(){
    buildURLs();
    preloadImages();

    const c = document.getElementById('content');
    c.innerHTML = '';

    for(const cat of categories){
        const key = cat.name;
        const done = cat.items.filter(i => checked.has(key+'|'+i)).length;
        const isDone = done === cat.items.length;

        const wrapper = document.createElement('div');
        wrapper.className = 'category' + (cat.name === "Gwen's Corner" ? ' gwen-cat' : '');
        wrapper.dataset.catName = cat.name;

        // Header
        const header = document.createElement('div');
        header.className = 'category-header';
        const gwenBadge = cat.name === "Gwen's Corner" ? ' <span class="cat-gwen-badge">Doll 🐾</span>' : '';
        header.innerHTML = `
            <div class="category-title">
                <div class="cat-icon">${cat.icon}</div>
                <span class="cat-name">${cat.name}${gwenBadge}</span>
            </div>
            <div class="right-side">
                <span class="category-count${isDone?' done':''}" id="cnt-${key}">${done}/${cat.items.length}</span>
                <span class="toggle-icon">▼</span>
            </div>`;
        header.addEventListener('click', ()=> wrapper.classList.toggle('collapsed'));

        // Items
        const list = document.createElement('div');
        list.className = 'items-list';

        for(const item of cat.items){
            const id = key + '|' + item;
            const isChecked = checked.has(id);

            const itemEl = document.createElement('div');
            itemEl.className = 'item' + (isChecked ? ' checked' : '');
            itemEl.dataset.id = id;
            itemEl.addEventListener('click', (e)=> {
                if(!e.target.closest('.shop-logo')) toggleItem(itemEl);
            });

            const cb = document.createElement('div');
            cb.className = 'checkbox';
            const txt = document.createElement('div');
            txt.className = 'item-text';
            txt.textContent = item;

            // Shop logos
            const logosDiv = document.createElement('div');
            logosDiv.className = 'shop-logos';

            // Flipkart
            const fkLogo = document.createElement('div');
            fkLogo.className = 'shop-logo logo-flipkart';
            fkLogo.innerHTML = `<svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>`;
            fkLogo.addEventListener('click', (e)=> openShop(item, 'fk', e));

            // Amazon
            const amzLogo = document.createElement('div');
            amzLogo.className = 'shop-logo logo-amazon';
            amzLogo.innerHTML = `<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>`;
            amzLogo.addEventListener('click', (e)=> openShop(item, 'amz', e));

            // Meesho
            const meeshoLogo = document.createElement('div');
            meeshoLogo.className = 'shop-logo logo-meesho';
            meeshoLogo.innerHTML = `<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm5 11h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>`;
            meeshoLogo.addEventListener('click', (e)=> openShop(item, 'meesho', e));

            logosDiv.appendChild(fkLogo);
            logosDiv.appendChild(amzLogo);
            logosDiv.appendChild(meeshoLogo);

            itemEl.appendChild(cb);
            itemEl.appendChild(txt);
            itemEl.appendChild(logosDiv);
            list.appendChild(itemEl);
        }

        wrapper.appendChild(header);
        wrapper.appendChild(list);
        c.appendChild(wrapper);
    }

    updateStats();

    // Set initial background = first category
    setBackground(categories[0].name);

    // Observer kicks in after DOM is painted
    requestAnimationFrame(()=> requestAnimationFrame(setupObserver));
}

function toggleItem(el){
    const id = el.dataset.id;
    if(!id) return;
    if(checked.has(id)){
        checked.delete(id);
        el.classList.remove('checked');
    } else {
        checked.add(id);
        el.classList.add('checked');
        if(navigator.vibrate) navigator.vibrate(40);
    }
    const cat = id.split('|')[0];
    const catObj = categories.find(c => c.name === cat);
    if(catObj){
        const d = catObj.items.filter(i => checked.has(cat+'|'+i)).length;
        const el2 = document.getElementById('cnt-'+cat);
        if(el2){ el2.textContent = d+'/'+catObj.items.length; el2.classList.toggle('done', d===catObj.items.length); }
    }
    save(); updateStats();
}

function updateStats(){
    let total=0,done=0;
    for(const cat of categories){ total+=cat.items.length; done+=cat.items.filter(i=>checked.has(cat.name+'|'+i)).length; }
    const pct=total?Math.round((done/total)*100):0;
    document.getElementById('statsText').textContent=done+'/'+total+' items packed';
    document.getElementById('statsPercent').textContent=pct+'%';
    document.getElementById('progressBar').style.width=pct+'%';
}

function save(){ storageSet('mv',JSON.stringify([...checked])); }
function expandAll(){ document.querySelectorAll('.category').forEach(c=>c.classList.remove('collapsed')); closeAll(); }
function collapseAll(){ document.querySelectorAll('.category').forEach(c=>c.classList.add('collapsed')); closeAll(); }
function toggleMenu(){ document.getElementById('menu').classList.toggle('show'); document.getElementById('overlay').classList.toggle('show'); }
function closeAll(){ ['menu','overlay','exportModal','resetModal'].forEach(id=>document.getElementById(id).classList.remove('show')); }
function showExport(){
    let md=`# Moving Checklist ${new Date().toLocaleDateString()}\n\n`;
    for(const cat of categories){ md+=`## ${cat.icon} ${cat.name}\n`; cat.items.forEach(i=>md+=`- [${checked.has(cat.name+'|'+i)?'x':' '}] ${i}\n`); md+='\n'; }
    document.getElementById('exportArea').value=md;
    document.getElementById('exportModal').classList.add('show');
    document.getElementById('overlay').classList.add('show');
}
function copyExport(){ navigator.clipboard.writeText(document.getElementById('exportArea').value).then(()=>showToast('Copied!')); }
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }
function confirmReset(){ closeAll(); document.getElementById('resetModal').classList.add('show'); document.getElementById('overlay').classList.add('show'); }
function doReset(){ checked.clear(); save(); init(); closeAll(); showToast('Progress reset!'); }

init();
</script>
</body>
